blueprint:
  name: "Paralelo Virtual Zigbee (Circadiano, Regras Avançadas)"
  description: >
    Sincroniza dispositivos Zigbee com grupo do Home Assistant.
    Liga luzes com base em ciclos circadianos ou configurações padrão.
    Aplica brilho/temperatura padrão ou circadiano. Evita loops com debounce e verificação de estado real.
  domain: automation
  input:
    dispositivos_individuais:
      name: Dispositivos Individuais (gatilhos)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true

    grupo_zigbee:
      name: Grupo de Luzes ou Switches (HA)
      selector:
        entity:
          domain:
            - light
            - switch

    template_estado_real:
      name: Entidade de Template do Estado Real
      description: "Ex: binary_sensor.grupo_iluminacao_sala_real_state"
      selector:
        entity:
          domain: binary_sensor

    timeout_espera_sincronizacao:
      name: Timeout de Espera pela Sincronização do Estado Real (segundos)
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: s

    usar_config_padrao:
      name: Aplicar Brilho e Temperatura Padrão?
      default: false
      selector:
        boolean: {}

    brilho_default:
      name: Brilho Padrão
      default: null
      selector:
        number:
          min: 1
          max: 255
          step: 1

    temperatura_default:
      name: Temperatura de Cor Padrão
      default: null
      selector:
        number:
          min: 153
          max: 500
          step: 1
          unit_of_measurement: mired

    usar_circadiano:
      name: Usar Ciclo Circadiano?
      default: false
      selector:
        boolean: {}

    entidade_circadiana_brilho:
      name: Entidade do Brilho Circadiano
      default: input_number.circadian_brightness
      selector:
        entity:
          domain: input_number

    entidade_circadiana_temp:
      name: Entidade da Temperatura Circadiana
      default: input_number.circadian_color_temp
      selector:
        entity:
          domain: input_number

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais
    for:
      milliseconds: 500

  - platform: state
    entity_id:
      - !input entidade_circadiana_brilho
      - !input entidade_circadiana_temp
    id: circadiano

variables:
  grupo: !input grupo_zigbee
  usar_padrao: !input usar_config_padrao
  usar_circadiano: !input usar_circadiano
  brilho_padrao: !input brilho_default
  temp_padrao: !input temperatura_default
  entidade_brilho: !input entidade_circadiana_brilho
  entidade_temp: !input entidade_circadiana_temp
  template_real: !input template_estado_real
  timeout_sincronizacao: !input timeout_espera_sincronizacao
  brilho_circadiano: "{{ states(entidade_brilho) | int(0) }}"
  temp_circadiano: "{{ states(entidade_temp) | int(0) }}"
  estado_final: >
    {% if trigger.id == 'circadiano' %}on{% else %}{{ trigger.to_state.state }}{% endif %}
  grupo_ativo: "{{ is_state(grupo, 'on') }}"

condition: []

action:
  - condition: template
    value_template: "{{ states(template_real) != estado_final }}"

  - wait_template: "{{ is_state(template_real, estado_final) }}"
    timeout: "{{ '00:00:' ~ timeout_sincronizacao }}"
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_circadiano and grupo_ativo }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_circadiano }}"
              color_temp: "{{ temp_circadiano }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is not none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is none and temp_padrao is not none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and (not usar_padrao and not usar_circadiano) }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ grupo }}"

mode: queued
max: 3
