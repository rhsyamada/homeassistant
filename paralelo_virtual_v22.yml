blueprint:
  name: Paralelo Virtual Zigbee (HA - Circadiano e Brilho/Temperatura Opcionais)
  description: >
    Sincroniza dispositivos Zigbee com um grupo do Home Assistant.
    Usa buffer para descartar eventos intermediários e aplica o último estado.
    Suporte ao ciclo circadiano (brilho e temperatura baseados em entidades externas).
  domain: automation
  input:
    dispositivos_individuais:
      name: Dispositivos Individuais (gatilhos)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    grupo_zigbee:
      name: Grupo de Luzes ou Switches (HA)
      selector:
        entity:
          domain:
            - light
            - switch
    intervalo_buffer_ms:
      name: Intervalo de Buffer (ms)
      description: Tempo de espera para aplicar o último estado após uma alternância
      default: 1000
      selector:
        number:
          min: 200
          max: 5000
          step: 100
          unit_of_measurement: ms
    usar_config_padrao:
      name: Aplicar Brilho e Temperatura Padrão?
      default: false
      selector:
        boolean: {}
    brilho_default:
      name: Brilho Padrão
      default: null
      selector:
        number:
          min: 1
          max: 255
          step: 1
    temperatura_default:
      name: Temperatura de Cor Padrão
      default: null
      selector:
        number:
          min: 153
          max: 500
          step: 1
          unit_of_measurement: mired
    usar_circadiano:
      name: Usar Ciclo Circadiano?
      default: false
      selector:
        boolean: {}

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais
  - platform: state
    entity_id:
      - input_number.circadian_brightness
      - input_number.circadian_color_temp
    id: circadiano

condition:
  - condition: template
    value_template: >
      {{ trigger.id == "circadiano" or
         (trigger.to_state.state != trigger.from_state.state) }}

variables:
  estado_final: "{{ trigger.to_state.state if trigger.id != 'circadiano' else 'on' }}"
  grupo: !input grupo_zigbee
  intervalo: !input intervalo_buffer_ms
  usar_padrao: !input usar_config_padrao
  usar_circadiano: !input usar_circadiano
  brilho_padrao: !input brilho_default
  temp_padrao: !input temperatura_default
  brilho_circadiano: "{{ states('input_number.circadian_brightness') | int(0) }}"
  temp_circadiano: "{{ states('input_number.circadian_color_temp') | int(0) }}"

action:
  - delay:
      milliseconds: !input intervalo_buffer_ms
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_circadiano }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_circadiano }}"
              color_temp: "{{ temp_circadiano }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is not none }}
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is none }}
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and usar_padrao and brilho_padrao is none and temp_padrao is not none }}
        sequence:
          - service: homeassistant.turn_on
            data:
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and (not usar_padrao and not usar_circadiano) }}
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ grupo }}"

mode: restart
max_exceeded: silent
