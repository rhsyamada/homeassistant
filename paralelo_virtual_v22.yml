blueprint:
  name: Paralelo Virtual Zigbee (HA - Brilho/Temperatura com Ativação)
  description: >
    Sincroniza dispositivos Zigbee com um grupo do Home Assistant.
    Usa buffer para descartar eventos intermediários e aplica o último estado.
    Brilho e temperatura padrão são aplicados somente se o parâmetro de ativação estiver habilitado.
  domain: automation
  input:
    dispositivos_individuais:
      name: Dispositivos Individuais (gatilhos)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    grupo_zigbee:
      name: Grupo de Luzes ou Switches (HA)
      selector:
        entity:
          domain:
            - light
            - switch
    intervalo_buffer_ms:
      name: Intervalo de Buffer (ms)
      description: Tempo de espera para aplicar o último estado após uma alternância
      default: 1500
      selector:
        number:
          min: 200
          max: 5000
          step: 100
          unit_of_measurement: ms
    usar_config_padrao:
      name: Aplicar Brilho e Temperatura Padrão?
      description: Se ativado, aplica brilho e temperatura definidos ao ligar o grupo
      default: false
      selector:
        boolean: {}
    brilho_default:
      name: Brilho Padrão (Opcional)
      default: null
      selector:
        number:
          min: 1
          max: 255
          mode: slider
          step: 1
    temperatura_default:
      name: Temperatura de Cor Padrão (Opcional)
      default: null
      selector:
        number:
          min: 153
          max: 500
          step: 1
          unit_of_measurement: mired

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"

variables:
  estado_final: "{{ trigger.to_state.state }}"
  grupo: !input grupo_zigbee
  intervalo: !input intervalo_buffer_ms
  usar_padrao: !input usar_config_padrao
  brilho: !input brilho_default
  cor_temp: !input temperatura_default

action:
  - delay:
      milliseconds: !input intervalo_buffer_ms
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and usar_padrao and brilho is not none and cor_temp is not none }}
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho }}"
              color_temp: "{{ cor_temp }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and usar_padrao and brilho is not none and cor_temp is none }}
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and usar_padrao and brilho is none and cor_temp is not none }}
        sequence:
          - service: homeassistant.turn_on
            data:
              color_temp: "{{ cor_temp }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: >
              {{ estado_final == 'on' and (not usar_padrao or (brilho is none and cor_temp is none)) }}
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ grupo }}"

mode: restart
max_exceeded: silent
