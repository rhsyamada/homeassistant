blueprint:
  name: Sincronização Avançada Zigbee (Compatível com Editor Visual)
  description: >
    Sincroniza estado, brilho e temperatura de cor entre dispositivos Zigbee em grupo.
    Compatível com entrada de dispositivos no formato usado pelo editor visual.
  domain: automation
  input:
    grupo_zigbee:
      name: Grupo de Dispositivos Zigbee
      selector:
        entity:
          domain: light
    dispositivos_individuais:
      name: Dispositivos Individuais Zigbee
      selector:
        target:
          entity:
            domain:
              - light
              - switch
    sensores_movimento:
      name: Sensores de Movimento (Opcional)
      default: []
      selector:
        target:
          entity:
            domain: binary_sensor
            device_class: motion
    transicao_suave:
      name: Tempo de Transição Suave
      default: 1
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: segundos

mode: restart
max_exceeded: silent

variables:
  grupo: !input grupo_zigbee
  transicao: !input transicao_suave
  sensores_mov: !input sensores_movimento
  dispositivos_raw: !input dispositivos_individuais
  entidades: >
    {{ expand(dispositivos_raw) | map(attribute='entity_id') | list }}

trigger:
  - platform: state
    entity_id: "{{ entidades }}"
    to: 'on'
    id: ligado
  - platform: state
    entity_id: "{{ entidades }}"
    to: 'off'
    id: desligado
  - platform: state
    entity_id: "{{ entidades }}"
    attribute: brightness
    id: brilho
  - platform: state
    entity_id: "{{ entidades }}"
    attribute: color_temp
    id: cor
  - platform: event
    event_type: state_changed
    id: movimento_detectado

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: ligado
        sequence:
          - service: light.turn_on
            data:
              transition: "{{ transicao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: trigger
            id: desligado
        sequence:
          - service: light.turn_off
            data:
              transition: "{{ transicao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: trigger
            id: brilho
        sequence:
          - service: light.turn_on
            data:
              brightness: "{{ state_attr(trigger.entity_id, 'brightness') }}"
              transition: "{{ transicao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: trigger
            id: cor
        sequence:
          - service: light.turn_on
            data:
              color_temp: "{{ state_attr(trigger.entity_id, 'color_temp') }}"
              transition: "{{ transicao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: trigger
            id: movimento_detectado
          - condition: template
            value_template: >
              {{ trigger.event.data.entity_id in sensores_mov and
                 trigger.event.data.new_state.state == 'on' }}
        sequence:
          - service: light.turn_on
            data:
              transition: "{{ transicao }}"
            target:
              entity_id: "{{ grupo }}"
