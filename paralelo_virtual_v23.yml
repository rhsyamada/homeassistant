blueprint:
  name: Paralelo Virtual Zigbee (Presença com Regras de Horário ou Iluminância)
  description: >
    Liga um grupo de luzes baseado em sensor de presença,
    respeitando um horário configurado OU uma iluminância mínima.
    Compatível com Zigbee2MQTT e Home Assistant.
  domain: automation
  input:
    sensor_presenca:
      name: Sensor de Presença
      selector:
        entity:
          domain: binary_sensor
    grupo_zigbee:
      name: Grupo de Luzes ou Switches
      selector:
        entity:
          domain:
            - light
            - switch
    horario_inicio:
      name: Início do Período Ativo
      description: Hora a partir da qual a automação pode acionar as luzes (formato HH:MM)
      default: "18:00"
      selector:
        time: {}
    horario_fim:
      name: Fim do Período Ativo
      description: Hora limite para a automação acionar as luzes (formato HH:MM)
      default: "06:00"
      selector:
        time: {}
    iluminancia_minima:
      name: Iluminância Mínima (lux)
      description: Se definido, aciona luzes apenas se iluminância atual for menor.
      default: null
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lux
    sensor_iluminancia:
      name: Sensor de Iluminância (Opcional)
      default: null
      selector:
        entity:
          domain: sensor

trigger:
  - platform: state
    entity_id: !input sensor_presenca
    to: "on"

condition:
  - condition: or
    conditions:
      - condition: template
        value_template: >
          {% set start = strptime((!input horario_inicio), '%H:%M').time() %}
          {% set end = strptime((!input horario_fim), '%H:%M').time() %}
          {% set now = now().time() %}
          {% if start < end %}
            {{ start <= now <= end }}
          {% else %}
            {{ now >= start or now <= end }}
          {% endif %}
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ !input iluminancia_minima is not none }}"
          - condition: numeric_state
            entity_id: !input sensor_iluminancia
            below: !input iluminancia_minima

action:
  - service: homeassistant.turn_on
    target:
      entity_id: !input grupo_zigbee

mode: restart
max_exceeded: silent
