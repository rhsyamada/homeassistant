blueprint:
  name: Paralelo Virtual Zigbee (Debounce Configurável)
  description: >
    Sincroniza o estado ON/OFF entre dispositivos Zigbee e um grupo de luzes.
    Compatível com o Editor Visual do Home Assistant.
    Inclui debounce inteligente com tempo ajustável, proteção contra loops e modo seguro.
  domain: automation
  input:
    grupo_zigbee:
      name: Grupo de Dispositivos Zigbee
      selector:
        entity:
          domain: light
    dispositivos_individuais:
      name: Dispositivos Individuais Zigbee
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    debounce_flag:
      name: Input Boolean para controle de debounce
      selector:
        entity:
          domain: input_boolean
    tempo_debounce:
      name: Tempo de Debounce (em milissegundos)
      description: Tempo de bloqueio após uma ação para evitar loops
      default: 1500
      selector:
        number:
          min: 100
          max: 5000
          step: 100
          unit_of_measurement: ms

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "on"
    id: ligado
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "off"
    id: desligado

condition: []

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input debounce_flag
            state: "off"
          - condition: template
            value_template: >
              {{ trigger.to_state.state != trigger.from_state.state }}
          - condition: trigger
            id: ligado
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input debounce_flag
          - service: light.turn_on
            target:
              entity_id: !input grupo_zigbee
          - delay:
              milliseconds: !input tempo_debounce

      - conditions:
          - condition: state
            entity_id: !input debounce_flag
            state: "off"
          - condition: template
            value_template: >
              {{ trigger.to_state.state != trigger.from_state.state }}
          - condition: trigger
            id: desligado
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input debounce_flag
          - service: light.turn_off
            target:
              entity_id: !input grupo_zigbee
          - delay:
              milliseconds: !input tempo_debounce

  - service: input_boolean.turn_off
    target:
      entity_id: !input debounce_flag

mode: queued
max_exceeded: silent
