action:
  - choose:
      - conditions:
          - condition: trigger
            id: ligado
          - condition: state
            entity_id: input_boolean.debounce_paralelo_virtual
            state: "off"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.debounce_paralelo_virtual
          - service: light.turn_on
            target:
              entity_id: !input grupo_zigbee
          - delay:
              milliseconds: 500
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.debounce_paralelo_virtual

      - conditions:
          - condition: trigger
            id: desligado
          - condition: state
            entity_id: input_boolean.debounce_paralelo_virtual
            state: "off"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.debounce_paralelo_virtual
          - service: light.turn_off
            target:
              entity_id: !input grupo_zigbee
          - delay:
              milliseconds: 500
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.debounce_paralelo_virtual
