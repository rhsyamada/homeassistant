blueprint:
  name: Paralelo Virtual Zigbee (Simples)
  description: >
    Sincroniza o estado ON/OFF entre dispositivos Zigbee e um grupo de luzes.
    Compatível com o Editor Visual do Home Assistant.
  domain: automation
  input:
    grupo_zigbee:
      name: Grupo de Dispositivos Zigbee
      selector:
        entity:
          domain: light
    dispositivos_individuais:
      name: Dispositivos Individuais Zigbee
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "on"
    id: ligado
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "off"
    id: desligado

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: ligado
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input grupo_zigbee

      - conditions:
          - condition: trigger
            id: desligado
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input grupo_zigbee

mode: restart
max_exceeded: silent
