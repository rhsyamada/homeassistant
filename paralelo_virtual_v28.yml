blueprint:
  name: "Paralelo Virtual Zigbee (Circadiano, Presença, Iluminância e Regras Avançadas)"
  description: >
    Sincroniza dispositivos Zigbee com grupo do Home Assistant.
    Liga luzes com base em presença, horários definidos ou iluminância.
    Aplica brilho/temperatura padrão ou circadiano. Inclui buffer e debounce.
  domain: automation
  input:
    # (mantido conforme está...)
    # ... parâmetros omitidos aqui para brevidade (já presentes no canvas) ...

trigger:
  # Disparo por alteração de estado de qualquer dispositivo monitorado
  - platform: state
    entity_id: !input dispositivos_individuais

  # Disparo por alteração das entidades circadianas (ajusta brilho/temperatura automaticamente)
  - platform: state
    entity_id:
      - !input entidade_circadiana_brilho
      - !input entidade_circadiana_temp
    id: circadiano

  # Disparo por sensores de presença
  - platform: state
    entity_id: !input sensores_presenca
    id: presenca

variables:
  grupo: !input grupo_zigbee
  intervalo: !input intervalo_buffer_ms
  usar_padrao: !input usar_config_padrao
  usar_circadiano: !input usar_circadiano
  usar_presenca: !input usar_presenca
  sensores_presenca: !input sensores_presenca
  presenca_por_horario: !input presenca_por_horario
  presenca_por_iluminancia: !input presenca_por_iluminancia
  horario1_ini: !input horario_presenca_1_inicio
  horario1_fim: !input horario_presenca_1_fim
  horario2_ini: !input horario_presenca_2_inicio
  horario2_fim: !input horario_presenca_2_fim
  brilho_padrao: !input brilho_default
  temp_padrao: !input temperatura_default
  entidade_brilho: !input entidade_circadiana_brilho
  entidade_temp: !input entidade_circadiana_temp
  brilho_circadiano: "{{ states(entidade_brilho) | int(0) }}"
  temp_circadiano: "{{ states(entidade_temp) | int(0) }}"
  iluminancia_minima: !input iluminancia_minima
  sensor_iluminancia: !input sensor_iluminancia

  # Determina o estado a ser usado com base no gatilho
  estado_final: >
    {% if trigger.id in ['circadiano', 'presenca'] %}on{% else %}{{ trigger.to_state.state }}{% endif %}

  # Valida se o horário atual está dentro de um dos períodos permitidos
  horario_ok: >
    {% set now = now().time() %}
    {% set h1_start = strptime(horario1_ini, '%H:%M').time() %}
    {% set h1_end = strptime(horario1_fim, '%H:%M').time() %}
    {% set h2_start = strptime(horario2_ini, '%H:%M').time() %}
    {% set h2_end = strptime(horario2_fim, '%H:%M').time() %}
    {{ (h1_start <= now <= h1_end) or (h2_start <= now <= h2_end) or (h1_start > h1_end and (now >= h1_start or now <= h1_end)) or (h2_start > h2_end and (now >= h2_start or now <= h2_end)) }}

  # Checa se algum sensor de presença está ativo
  presenca_ativa: >
    {{ sensores_presenca | select('is_state', 'on') | list | count > 0 }}

condition:
  - condition: or
    conditions:
      # Qualquer evento que não seja de presença
      - condition: template
        value_template: "{{ trigger.id != 'presenca' }}"

      # Iluminância priorizada e dentro do limite
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ presenca_por_iluminancia and iluminancia_minima is not none }}"
          - condition: numeric_state
            entity_id: !input sensor_iluminancia
            below: !input iluminancia_minima

      # Presença detectada e horário permitido (se configurado)
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ usar_presenca and presenca_ativa }}"
          - condition: template
            value_template: "{{ not presenca_por_horario or horario_ok }}"

action:
  - delay:
      milliseconds: !input intervalo_buffer_ms

  - choose:
      # Acionamento com valores circadianos
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_circadiano }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_circadiano }}"
              color_temp: "{{ temp_circadiano }}"
            target:
              entity_id: "{{ grupo }}"

      # Acionamento com brilho e temperatura padrão
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is not none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      # Apenas brilho padrão
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      # Apenas temperatura padrão
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is none and temp_padrao is not none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      # Ligamento simples (sem temperatura/brilho)
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and (not usar_padrao and not usar_circadiano) }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: "{{ grupo }}"

      # Desligamento por ausência
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'off' or (usar_presenca and not presenca_ativa) }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ grupo }}"

mode: restart
max_exceeded: silent
