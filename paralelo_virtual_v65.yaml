...
variables:
  grupo: !input grupo_zigbee
  usar_padrao: !input usar_config_padrao
  usar_circadiano: !input usar_circadiano
  brilho_padrao: !input brilho_default
  temp_padrao: !input temperatura_default
  entidade_brilho: !input entidade_circadiana_brilho
  entidade_temp: !input entidade_circadiana_temp
  template_real: !input template_estado_real
  timeout_sincronizacao: !input timeout_espera_sincronizacao
  brilho_circadiano: "{{ states(entidade_brilho) | int(0) }}"
  temp_circadiano: "{{ states(entidade_temp) | int(0) }}"
  estado_final: >
    {% if trigger.id == 'circadiano' %}on{% else %}{{ trigger.to_state.state }}{% endif %}
  grupo_ativo: "{{ is_state(grupo, 'on') }}"
  tempo_desde_trigger: >
    {% set now = now() %}
    {% set last = as_datetime(trigger.to_state.last_changed) %}
    {{ (now - last).total_seconds() }}

...
action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ tempo_desde_trigger > 2 }}"
        sequence:
          - wait_template: "{{ is_state(template_real, estado_final) }}"
            timeout: "{{ '00:00:' ~ timeout_sincronizacao }}"
            continue_on_timeout: true

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_circadiano and grupo_ativo }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_circadiano }}"
              color_temp: "{{ temp_circadiano }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is not none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is not none and temp_padrao is none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              brightness: "{{ brilho_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and usar_padrao and brilho_padrao is none and temp_padrao is not none }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              color_temp: "{{ temp_padrao }}"
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' and (not usar_padrao and not usar_circadiano) }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: "{{ grupo }}"

      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ grupo }}"
