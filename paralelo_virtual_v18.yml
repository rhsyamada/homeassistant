blueprint:
  name: Paralelo Virtual Zigbee (Dispositivo para Grupo)
  description: >
    Sincroniza o estado ON/OFF de dispositivos Zigbee com um grupo de luzes.
    Ação unidirecional: mudanças nos dispositivos individuais afetam o grupo, mas não o contrário.
    Previne qualquer possibilidade de loop infinito.
  domain: automation
  input:
    grupo_zigbee:
      name: Grupo de Dispositivos Zigbee
      selector:
        entity:
          domain: light
    dispositivos_individuais:
      name: Dispositivos Individuais Zigbee (fonte de controle)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "on"
    id: ligado
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "off"
    id: desligado

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: ligado
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input grupo_zigbee

      - conditions:
          - condition: trigger
            id: desligado
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input grupo_zigbee

mode: queued
max_exceeded: silent
