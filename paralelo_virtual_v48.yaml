blueprint:
  name: "Paralelo Virtual Zigbee (Circadiano, Presença, Regras Avançadas)"
  description: >
    Sincroniza dispositivos Zigbee com grupo do Home Assistant.
    Liga luzes com base em presença e horários definidos.
    Aplica brilho/temperatura padrão ou circadiano. Inclui buffer e debounce.
  domain: automation
  input:
    dispositivos_individuais:
      name: Dispositivos Individuais (gatilhos)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true

    grupo_zigbee:
      name: Grupo de Luzes ou Switches (HA)
      selector:
        entity:
          domain:
            - light
            - switch

    usar_presenca:
      name: Usar Sensor de Presença?
      default: false
      selector:
        boolean: {}

    sensores_presenca:
      name: Sensores de Presença
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
          multiple: true

    tempo_luz_acesa:
      name: Tempo que a luz deve permanecer acesa após detectar presença (segundos)
      default: 60
      selector:
        number:
          min: 10
          max: 3600
          step: 1
          unit_of_measurement: s

automation:
  - alias: Paralelo Virtual Zigbee - Controle por Presença
    trigger:
      - platform: state
        entity_id: !input sensores_presenca
        to: "on"

    condition: []

    action:
      - variables:
          timeout: !input tempo_luz_acesa

      - service: homeassistant.turn_on
        target:
          entity_id: !input grupo_zigbee

      - wait_for_trigger:
          - platform: state
            entity_id: !input sensores_presenca
            to: "off"
        continue_on_timeout: true
        timeout: "{{ timeout | int }}"

      - repeat:
          while:
            - condition: template
              value_template: >
                {{ expand(!input sensores_presenca) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          sequence:
            - delay:
                seconds: 1
            - wait_for_trigger:
                - platform: state
                  entity_id: !input sensores_presenca
                  to: "off"
              timeout: "{{ timeout | int }}"
              continue_on_timeout: true

      - condition: template
        value_template: >
          {{ expand(!input sensores_presenca) | selectattr('state', 'eq', 'on') | list | count == 0 }}

      - service: homeassistant.turn_off
        target:
          entity_id: !input grupo_zigbee

mode: restart
max_exceeded: silent
