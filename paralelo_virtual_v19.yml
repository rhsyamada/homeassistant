blueprint:
  name: Paralelo Virtual Zigbee2MQTT (Desempenho Total, Sem Loop)
  description: >
    Sincroniza dispositivos Zigbee com grupo MQTT de forma unidirecional.
    Usa dispositivos individuais como gatilho e grupo nativo Zigbee2MQTT como destino.
    Não monitora o grupo. Sem debounce. Sem loop. Alta performance.
  domain: automation
  input:
    grupo_zigbee:
      name: Grupo Zigbee2MQTT (destino)
      selector:
        entity:
          domain: light
    dispositivos_individuais:
      name: Dispositivos Individuais (fonte de eventos)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "on"
    id: ligado

  - platform: state
    entity_id: !input dispositivos_individuais
    to: "off"
    id: desligado

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.state != trigger.from_state.state }}

action:
  - choose:
      - conditions:
          - condition: trigger
            id: ligado
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input grupo_zigbee

      - conditions:
          - condition: trigger
            id: desligado
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input grupo_zigbee

mode: single
