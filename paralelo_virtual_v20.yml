blueprint:
  name: Paralelo Virtual Zigbee (HA - Com Partida Suave)
  description: >
    Sincroniza dispositivos Zigbee com um grupo do Home Assistant.
    Usa buffer para descartar eventos intermediários e só executa o último estado com animação de partida suave.
  domain: automation
  input:
    dispositivos_individuais:
      name: Dispositivos Individuais (gatilhos)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    grupo_zigbee:
      name: Grupo de Luzes ou Switches (HA)
      selector:
        entity:
          domain:
            - light
            - switch
    intervalo_buffer_ms:
      name: Intervalo de Buffer (ms)
      description: Tempo de espera para aplicar o último estado após uma alternância
      default: 1500
      selector:
        number:
          min: 200
          max: 5000
          step: 100
          unit_of_measurement: ms
    tempo_transicao:
      name: Tempo de Transição (Partida Suave)
      description: Duração da animação ao ligar o grupo
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 1
          unit_of_measurement: s

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"

variables:
  estado_final: "{{ trigger.to_state.state }}"
  grupo: !input grupo_zigbee
  intervalo: !input intervalo_buffer_ms
  transicao: !input tempo_transicao

action:
  - delay:
      milliseconds: !input intervalo_buffer_ms
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              transition: "{{ transicao }}"
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ grupo }}"

mode: restart
max_exceeded: silent
