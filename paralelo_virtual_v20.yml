blueprint:
  name: Paralelo Virtual Zigbee (HA - Com Brilho e Temperatura)
  description: >
    Sincroniza dispositivos Zigbee com um grupo do Home Assistant.
    Usa buffer para descartar eventos intermediários e aplica o último estado.
    Permite definir brilho e temperatura padrão ao ligar o grupo.
  domain: automation
  input:
    dispositivos_individuais:
      name: Dispositivos Individuais (gatilhos)
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    grupo_zigbee:
      name: Grupo de Luzes ou Switches (HA)
      selector:
        entity:
          domain:
            - light
            - switch
    intervalo_buffer_ms:
      name: Intervalo de Buffer (ms)
      description: Tempo de espera para aplicar o último estado após uma alternância
      default: 1500
      selector:
        number:
          min: 200
          max: 5000
          step: 100
          unit_of_measurement: ms
    brilho_default:
      name: Brilho Padrão (Opcional)
      default: null
      selector:
        number:
          min: 1
          max: 255
          mode: slider
          step: 1
    temperatura_default:
      name: Temperatura de Cor Padrão (Opcional)
      default: null
      selector:
        number:
          min: 153
          max: 500
          step: 1
          unit_of_measurement: mired

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"

variables:
  estado_final: "{{ trigger.to_state.state }}"
  grupo: !input grupo_zigbee
  intervalo: !input intervalo_buffer_ms
  brilho: !input brilho_default
  cor_temp: !input temperatura_default

action:
  - delay:
      milliseconds: !input intervalo_buffer_ms
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'on' }}"
        sequence:
          - service: homeassistant.turn_on
            data:
              {% if brilho is not none %}
              brightness: "{{ brilho }}"
              {% endif %}
              {% if cor_temp is not none %}
              color_temp: "{{ cor_temp }}"
              {% endif %}
            target:
              entity_id: "{{ grupo }}"
      - conditions:
          - condition: template
            value_template: "{{ estado_final == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ grupo }}"

mode: restart
max_exceeded: silent
