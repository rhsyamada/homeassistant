blueprint:
  name: Paralelo Virtual Zigbee (Debounce Inteligente Corrigido)
  description: >
    Sincroniza o estado ON/OFF entre dispositivos Zigbee e um grupo de luzes.
    Compatível com o Editor Visual do Home Assistant.
    Usa debounce inteligente com desligamento garantido e modo seguro contra interrupções.
  domain: automation
  input:
    grupo_zigbee:
      name: Grupo de Dispositivos Zigbee
      selector:
        entity:
          domain: light
    dispositivos_individuais:
      name: Dispositivos Individuais Zigbee
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    debounce_flag:
      name: Input Boolean para controle de debounce
      selector:
        entity:
          domain: input_boolean

trigger:
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "on"
    id: ligado
  - platform: state
    entity_id: !input dispositivos_individuais
    to: "off"
    id: desligado

condition: []

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input debounce_flag
            state: "off"
          - condition: trigger
            id: ligado
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input debounce_flag
          - service: light.turn_on
            target:
              entity_id: !input grupo_zigbee
          - delay:
              milliseconds: 500

      - conditions:
          - condition: state
            entity_id: !input debounce_flag
            state: "off"
          - condition: trigger
            id: desligado
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input debounce_flag
          - service: light.turn_off
            target:
              entity_id: !input grupo_zigbee
          - delay:
              milliseconds: 500

  # Desligamento garantido do debounce
  - service: input_boolean.turn_off
    target:
      entity_id: !input debounce_flag

mode: queued
max_exceeded: silent
